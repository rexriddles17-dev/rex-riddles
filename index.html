<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5E3B">
<title>Rex Riddles</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>">

<!-- Fonts (for the iOS app, these will be bundled locally in /fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/hangman.css">
<link rel="stylesheet" href="css/detective.css">
<link rel="stylesheet" href="css/sudoku.css">
<link rel="stylesheet" href="css/trivia.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">🦖 Rex Riddles</a>
    <div class="rank" aria-live="polite">
      <span class="rank-name" id="rankName">Egg</span>
      <div class="xpbar" title="XP to next level"><div class="xpfill" id="xpFill"></div></div>
    </div>
  </header>

  <main id="app"></main>
  <div class="toast" id="toast" role="status"></div>

  <!-- Load order matters: core → data → art → games → screens → main -->
  <script src="js/core/namespace.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/progress.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/daily.js"></script>

  <script src="js/data/ranks.js"></script>
  <script src="js/data/hangman-words.js"></script>
  <script src="js/data/detective-levels.js"></script>
  <script src="js/data/detective-cases.js"></script>
  <script src="js/data/detective-daily.js"></script>
  <script src="js/data/sudoku.js"></script>
  <script src="js/data/trivia.js"></script>

  <script src="js/art/dinos.js"></script>
  <script src="js/art/portraits.js"></script>
  <script src="js/art/scenery.js"></script>

  <script src="js/games/hangman.js"></script>
  <script src="js/games/detective-daily.js"></script>
  <script src="js/games/detective.js"></script>
  <script src="js/games/sudoku.js"></script>
  <script src="js/games/trivia.js"></script>
  <script src="js/games/coming-soon.js"></script>

  <script src="js/screens/home.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
